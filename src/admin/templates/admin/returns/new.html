{% extends "admin/base.html" %}
{% block title %}New Return Order{% endblock %}
{% block content %}
<div class="page-header">
  <h2>New Return Order</h2>
  <a href="/admin/returns" class="btn">← Back to Returns</a>
</div>

<form method="POST" action="/admin/returns/new" style="max-width:560px;">
  <div class="card" style="margin-bottom:1rem;">
    <h3 style="font-size:0.95rem;margin-bottom:0.5rem;">Return Details</h3>
    <label style="display:block;margin-top:0.75rem;">Reason (required)
      <select name="reason" required style="width:100%;padding:0.4rem 0.5rem;border-radius:0.3rem;margin-top:0.2rem;">
        {% for r in ['damaged','wrong_item','quality_issue','customer_retrieval','address_error','duplicate_order'] %}
          <option value="{{ r }}">{{ r }}</option>
        {% endfor %}
      </select>
    </label>
    <label style="display:block;margin-top:0.75rem;">Reason Detail
      <textarea name="reason_detail" rows="3" style="width:100%;padding:0.4rem 0.5rem;border-radius:0.3rem;margin-top:0.2rem;"></textarea>
    </label>
    <label style="display:block;margin-top:0.75rem;">Refund Amount (¥)
      <input type="number" step="0.01" name="refund_amount" value="0.00" min="0" style="width:200px;padding:0.4rem 0.5rem;border-radius:0.3rem;margin-top:0.2rem;">
    </label>
  </div>

  <div class="card" style="margin-bottom:1rem;">
    <h3 style="font-size:0.95rem;margin-bottom:0.5rem;">Pickup / Carrier</h3>
    <label style="display:block;margin-top:0.75rem;">Carrier
      <select name="carrier_code" style="width:100%;padding:0.4rem 0.5rem;border-radius:0.3rem;margin-top:0.2rem;">
        {% for c in ['sf_express','zto','yunda','jd_logistics','ems'] %}
          <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </label>
  </div>

  <button type="submit" class="btn btn-primary">Create Return</button>
</form>
{% endblock %}
