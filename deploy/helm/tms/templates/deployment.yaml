apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tms.fullname" . }}-app
  labels:
    {{- include "tms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "tms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "tms.fullname" . }}-env
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: DATABASE_URL
            - name: DATABASE_SYNC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: DATABASE_SYNC_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: REDIS_URL
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SMTP_PASSWORD
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SENTRY_DSN
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.app | nindent 12 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tms.fullname" . }}-worker
  labels:
    {{- include "tms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.celery.worker.replicas }}
  selector:
    matchLabels:
      {{- include "tms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "tms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "src.celery_app", "worker", "--loglevel=info", "--concurrency={{ .Values.celery.worker.concurrency }}"]
          envFrom:
            - configMapRef:
                name: {{ include "tms.fullname" . }}-env
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: DATABASE_URL
            - name: DATABASE_SYNC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: DATABASE_SYNC_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: REDIS_URL
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SMTP_PASSWORD
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SENTRY_DSN
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
{{- if .Values.celery.beat.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tms.fullname" . }}-beat
  labels:
    {{- include "tms.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tms.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "tms.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "tms.fullname" . }}-env
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: DATABASE_URL
            - name: DATABASE_SYNC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: DATABASE_SYNC_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tms.fullname" . }}
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
{{- end }}
