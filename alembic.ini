[alembic]
script_location = alembic
prepend_sys_path = .
# Set via environment variable DATABASE_SYNC_URL in production.
# Falls back to local dev default for convenience.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/oms_wms_tms

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
